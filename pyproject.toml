[project]
name = "lfpweather-timestral"
version = "0.1.0"
description = "Hourly temperature forecasts for lfpweather using Mistral Timestral-209M"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "torch",
    "pydantic-settings",
    "prometheus-client",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.149.0",
    "uvicorn>=0.54.0",
    "apscheduler<4",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "testcontainers[postgres]",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lfpweather_timestral"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: slow tests (model download)",
    "db: needs a Docker Timescale container",
]

[tool.ruff]
line-length = 100
